<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shapes - FixedFunction</title>
    <style>
      body {
        background-color: #12141c;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }
      .container {
        background-color: #171923;
        border: 1px solid #232733;
        padding: 24px;
        border-radius: 10px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      }
      /* Barra superior: Elementos alineados a la izquierda */
      .header-ui {
        display: flex;
        justify-content: flex-start;
        align-items: center;
        gap: 30px;
        margin-bottom: 20px;
        font-size: 14px;
      }
      .title {
        font-weight: bold;
        font-size: 16px;
        color: #ffffff;
        letter-spacing: 0.3px;
      }
      .controls-group {
        display: flex;
        align-items: center;
        gap: 15px;
        color: #a0aec0;
        font-size: 13px;
      }
      /* Botones con tono azulado */
      .interactive-badge {
        background-color: #3b82f6; /* Tono azul vibrante */
        color: #ffffff;
        border: none;
        padding: 5px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        font-size: 13px;
        transition: background-color 0.2s;
      }
      .interactive-badge:hover {
        background-color: #2563eb; /* Azul un poco más oscuro al pasar el mouse */
      }
      /* Recuadro interno con borde fino que contiene el canvas */
      .canvas-wrapper {
        border: 1px solid #282d3d;
        border-radius: 6px;
        overflow: hidden;
        background-color: #13151d;
        display: inline-block;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Barra superior con título y botones a la izquierda en tono azul -->
      <div class="header-ui">
        <span class="title">Shapes</span>
        <div class="controls-group">
          <button id="btn-figure" class="interactive-badge" type="button">Shape: </button>
          <button id="btn-color" class="interactive-badge" type="button">Color: </button>
        </div>
      </div>

      <!-- Contenedor interno con borde fino para la figura -->
      <div class="canvas-wrapper">
        <canvas id="gl-canvas"></canvas>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
